<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사이트 이름</title>
<!-- 앱(홈 화면에 추가) 설정 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b4fc6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자취지도">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  /* ===== 색 (여기 값만 바꾸면 사이트 전체 색이 바뀌어요) ===== */
  :root {
    --bg: #f6f9fe; --bg2: #eef4fe; --panel: #ffffff; --text: #12213f; --muted: #33405a; --line: #dbe5f5;
    --accent: #0b4fc6; --accent-2: #9dbcf3; --accent-weak: #e3eefe; --navy: #0f1d40;
    --shadow: 0 8px 24px rgba(30,80,170,.08);
    --hero1: #f6f9fe; --hero2: #eef4fe; --ic-blend: multiply;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1322; --bg2: #0f1729; --panel: #151f36; --text: #e8eefb; --muted: #aab7d0; --line: #263352;
      --accent: #6b9bff; --accent-2: #3b5ea8; --accent-weak: #1a2a52; --navy: #e8eefb;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --hero1: #101a30; --hero2: #0c1322; --ic-blend: normal;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1322; --bg2: #0f1729; --panel: #151f36; --text: #e8eefb; --muted: #aab7d0; --line: #263352;
    --accent: #6b9bff; --accent-2: #3b5ea8; --accent-weak: #1a2a52; --navy: #e8eefb;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    --hero1: #101a30; --hero2: #0c1322; --ic-blend: normal;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed; color: var(--text); line-height: 1.6;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  .container { max-width: 1360px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 100; background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
  }
  .topbar .container { display: flex; align-items: center; height: 80px; gap: 24px; }
  .logo { display: flex; align-items: center; gap: 8px; color: var(--accent); white-space: nowrap; cursor: pointer; }
  .logo b { font-size: 27px; font-weight: 900; letter-spacing: -1px; color: var(--navy); }
  .logo b span { color: var(--accent); }
  .divider { width: 1px; height: 26px; background: var(--line); }
  .menu { display: flex; gap: 2px; }
  .menu a {
    padding: 9px 14px; border-radius: 999px; font-size: 15.5px; font-weight: 500; white-space: nowrap; color: var(--text);
  }
  .menu a:hover { background: var(--accent-weak); }
  .menu a.active { color: var(--accent); background: var(--accent-weak); font-weight: 700; }
  .tools { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; cursor: pointer; font-size: 16px; color: var(--text);
  }
  .start-btn {
    display: flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; white-space: nowrap;
  }
  .start-btn:hover { filter: brightness(1.08); }
  #burger { display: none; }

  /* ---------- Hero ---------- */
  .hero { overflow: hidden; }
  .hero .container { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: center; min-height: 420px; }
  .hero-text { display: flex; flex-direction: column; gap: 16px; padding: 24px 0 36px; position: relative; z-index: 2; }
  .tagline {
    font-family: "Nanum Pen Script", cursive; font-size: 28px; color: var(--accent); transform: rotate(-3deg); transform-origin: left;
    text-decoration: underline; text-decoration-color: var(--accent-2); text-underline-offset: 6px; align-self: flex-start;
  }
  .hero h1 { font-size: 58px; line-height: 1.18; margin: 0; font-weight: 900; letter-spacing: -2.5px; color: var(--navy); }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); font-size: 18.5px; font-weight: 500; }
  .hero-art {
    display: block; margin-right: -24px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16%); mask-image: linear-gradient(90deg, transparent 0, #000 16%);
  }
  .hero-art img {
    /* 원본 그림 왼쪽 아래의 '검색' 버튼 조각과 위쪽 가장자리를 잘라내요 */
    display: block; width: 120%; max-width: none; height: auto; margin: -3.5% 0 0 -20%;
  }
  .search { position: relative; max-width: 680px; margin-top: 12px; }
  .search-box {
    display: flex; align-items: center; gap: 12px; padding: 7px 7px 7px 24px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(30,80,170,.10);
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { flex-shrink: 0; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 17px; color: var(--text); }
  .search button {
    border: none; border-radius: 999px; padding: 14px 40px; background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 700; letter-spacing: 4px; cursor: pointer;
  }
  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); max-height: 360px; overflow-y: auto; display: none; z-index: 50;
  }
  .search-results.show { display: block; }
  .search-results a { display: block; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .search-results a:last-child { border-bottom: none; }
  .search-results a:hover { background: var(--bg); }
  .search-results small { color: var(--muted); display: block; font-size: 12px; }
  .search-results .none { padding: 14px 16px; color: var(--muted); font-size: 14px; }

  /* ---------- Sections ---------- */
  section.block { padding: 22px 0 18px; }
  .sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .sec-head::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--accent); }
  .sec-title { font-size: 26px; margin: 0; font-weight: 900; letter-spacing: -1px; }
  .sec-sub {
    margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px;
    background: none; border: none; padding: 6px 0; cursor: pointer;
  }
  .arrow {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-grid; place-items: center; flex-shrink: 0;
  }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .menu-card {
    position: relative; min-height: 146px; padding: 22px 56px 22px 22px; border-radius: 18px;
    background: linear-gradient(135deg, var(--t1, #e3eefe), var(--t2, #f2f7ff));
    border: 1px solid rgba(255,255,255,.8); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 18px; transition: transform .15s, box-shadow .15s;
  }
  .menu-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(30,80,170,.14); }
  .menu-card .ic { width: 96px; flex-shrink: 0; display: grid; place-items: center; font-size: 48px; }
  .menu-card .ic img { width: 100%; height: auto; mix-blend-mode: var(--ic-blend); border-radius: 14px; }
  .menu-card h3 { margin: 0 0 6px; font-size: 22px; font-weight: 900; letter-spacing: -.8px; color: #12213f; }
  .menu-card p { margin: 0; color: #33405a; font-size: 14.5px; }
  .menu-card .cnt { margin-top: 6px; font-size: 13px; color: #0b4fc6; font-weight: 700; }
  .chev {
    position: absolute; right: 16px; bottom: 16px; width: 34px; height: 34px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: grid; place-items: center; color: #0f1d40;
  }

  .hot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .hot-card {
    position: relative; display: flex; border-radius: 14px; overflow: hidden; background: var(--panel);
    border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .15s;
  }
  .hot-card:hover { transform: translateY(-3px); }
  .hot-card > img { width: 170px; height: 150px; object-fit: cover; flex-shrink: 0; }
  .hot-card .txt { padding: 18px 54px 18px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .hot-card .tag { align-self: flex-start; padding: 3px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .hot-card h3 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.8px; }
  .hot-card p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hot-card .chev { border: 1px solid var(--line); bottom: 18px; }

  /* ---------- Page ---------- */
  .page-head { background: linear-gradient(135deg, var(--hero1), var(--hero2)); border-bottom: 1px solid var(--line); padding: 40px 0 32px; }
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .crumb a:hover { color: var(--accent); }
  .page-head h1 { margin: 0; font-size: 32px; letter-spacing: -.8px; }
  .page-head p { margin: 6px 0 0; color: var(--muted); }
  .page-body { display: grid; grid-template-columns: 210px 1fr; gap: 32px; padding: 32px 0 60px; }
  .toc { position: sticky; top: 84px; align-self: start; }
  .toc b { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .toc a { display: block; padding: 7px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); border-left: 2px solid transparent; }
  .toc a:hover { color: var(--text); background: var(--panel); }
  .group { margin-bottom: 32px; scroll-margin-top: 84px; }
  .group h2 { font-size: 19px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .tip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden;
    transition: border-color .15s;
  }
  .tip.open { border-color: var(--accent-2); }
  .tip summary {
    list-style: none; padding: 16px 18px; cursor: pointer; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 10px;
  }
  .tip summary::-webkit-details-marker { display: none; }
  .tip summary::after { content: "＋"; margin-left: auto; color: var(--muted); font-weight: 400; transition: transform .2s; }
  .tip[open] summary::after { transform: rotate(45deg); color: var(--accent); }
  .tip .num {
    width: 26px; height: 26px; border-radius: 8px; background: var(--accent-weak); color: var(--accent);
    display: grid; place-items: center; font-size: 13px; flex-shrink: 0;
  }
  .tip .body { padding: 0 18px 18px 54px; color: var(--text); font-size: 14.5px; }
  .tip .body p { margin: 0 0 8px; }
  .tip .body ul { margin: 0; padding-left: 18px; }
  .tip .body li { margin: 3px 0; }
  .tip .body .note { background: var(--accent-weak); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }
  .tip.hl { animation: hl 1.6s; }
  @keyframes hl { 0%,40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }

  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; }
  .pager a {
    flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 18px; font-size: 14px;
  }
  .pager a:hover { border-color: var(--accent-2); }
  .pager a small { display: block; color: var(--muted); font-size: 12px; }
  .pager a.next { text-align: right; }

  footer { margin-top: 36px; padding: 26px 0 34px; color: var(--muted); font-size: 14.5px; text-align: center; }
  footer .container { display: flex; align-items: center; justify-content: center; gap: 18px; }
  footer .container::before, footer .container::after { content: ""; width: 70px; height: 1px; background: var(--line); }
  footer a { color: var(--accent); }

  /* ---------- 중간 화면 ---------- */
  @media (max-width: 1200px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hot { grid-template-columns: 1fr; }
    .menu a { padding: 9px 10px; font-size: 14.5px; }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 1100px) {
    #burger { display: grid; }
    .divider { display: none; }
    .menu {
      position: fixed; top: 80px; left: 0; right: 0; background: var(--panel); border-bottom: 1px solid var(--line);
      flex-direction: column; padding: 8px 12px 14px; display: none; box-shadow: var(--shadow);
    }
    .menu.open { display: flex; }
    .menu a { padding: 12px; font-size: 15px; border-radius: 10px; }
  }
  @media (max-width: 900px) {
    .hero .container { grid-template-columns: 1fr; }
    .hero-text { padding-bottom: 8px; }
    .hero-art { margin: 0 -24px; }
    .hero-art { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12%); mask-image: linear-gradient(180deg, transparent 0, #000 12%); }
    .page-body { grid-template-columns: 1fr; }
    .toc { position: static; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .toc b { display: none; }
    .toc a { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; white-space: nowrap; padding: 6px 12px; font-size: 13px; }
  }
  /* 모바일 전용 요소는 기본으로 숨김 */
  .m-only { display: none !important; }

  /* ================= 모바일 (휴대폰) 디자인 ================= */
  @media (max-width: 600px) {
    .m-only { display: revert !important; }
    .m-map.m-only, .m-banner.m-only { display: block !important; }
    .d-only { display: none !important; }
    body { padding-bottom: calc(62px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #eaf2fe 0, var(--bg) 360px, var(--bg2) 100%) fixed; }
    :root[data-theme="dark"] body { background: var(--bg); }
    .container { padding: 0 16px; }

    /* 헤더 */
    .topbar { background: transparent; backdrop-filter: none; border-bottom: none; position: relative; }
    .topbar .container { height: 58px; gap: 4px; padding-right: 8px; }
    .logo { gap: 6px; }
    .logo svg { width: 32px; height: 28px; }
    .logo .logo-txt { display: flex; flex-direction: column; line-height: 1; }
    .logo b { font-size: 20px; letter-spacing: -.8px; }
    .logo small { font-size: 9px; font-weight: 500; color: var(--muted); margin-top: 3px; }
    #themeBtn, .start-btn { display: none; }
    .tools { gap: 0; }
    .tools .icon-btn { width: 44px; height: 44px; border: none; background: transparent; font-size: 20px; }
    .menu { top: 58px; z-index: 120; }

    /* 히어로: 글자 왼쪽, 사진 오른쪽 */
    .hero { overflow: visible; }
    .hero .container { display: block; position: relative; min-height: 0; }
    .hero-art {
      position: absolute; right: 0; top: -6px; width: 66%; margin: 0; z-index: 0;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 40%); mask-image: linear-gradient(90deg, transparent 0, #000 40%);
    }
    .hero-art img { width: 140%; margin: 0 0 0 -40%; }
    .hero-text { padding: 6px 0 0; gap: 6px; }
    .hero-text > :not(.search) { max-width: 64%; }
    .tagline { font-size: 19px; text-decoration: none; }
    .hero h1 { font-size: 25px; line-height: 1.25; letter-spacing: -1.2px; }
    .hero p { font-size: 12px; line-height: 1.5; margin-top: 2px; max-width: 54% !important; text-shadow: 0 0 8px var(--bg), 0 0 4px var(--bg); }
    .search { margin-top: 18px; }
    .hero-text > .search { max-width: none; }
    .search-box { padding: 4px 4px 4px 14px; gap: 8px; box-shadow: 0 8px 22px rgba(30,80,170,.10); }
    .search-box svg { width: 18px; height: 18px; }
    .search input { font-size: 12.5px; }
    .search button { height: 38px; padding: 0 20px; font-size: 14px; letter-spacing: 0; }

    /* 섹션 */
    section.block { padding: 7px 0; }
    .hero + section.block { padding-top: 14px; }
    .menu-sec .sec-head { display: none; }
    .sec-head { gap: 6px; margin-bottom: 8px; flex-wrap: nowrap; }
    .sec-head::before { display: none; }
    .sec-title { font-size: 15px; letter-spacing: -.5px; }
    .sec-sub { margin-left: auto; font-size: 11.5px; color: var(--accent); gap: 4px; white-space: nowrap; }
    .sec-sub .arrow { background: none; color: var(--accent); width: 14px; height: 14px; }

    /* 메뉴 카드 2열 */
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .menu-card { min-height: 74px; padding: 8px 26px 8px 10px; gap: 8px; border-radius: 14px; box-shadow: 0 4px 14px rgba(30,80,170,.07); }
    .menu-card:hover { transform: none; }
    .menu-card .ic { width: 54px; font-size: 30px; }
    .menu-card .ic img { border-radius: 10px; }
    .menu-card h3 { font-size: 14.5px; letter-spacing: -.6px; margin: 0 0 2px; }
    .menu-card p { font-size: 10.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .menu-card .cnt { display: none; }
    .chev { right: 8px; bottom: 8px; width: 22px; height: 22px; box-shadow: 0 1px 5px rgba(0,0,0,.1); }
    .chev svg { width: 11px; height: 11px; }

    /* 주변 지도 미리보기 */
    .m-map { margin-top: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(30,80,170,.07); overflow: hidden; }
    .m-map .head { height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; }
    .m-map h2 { margin: 0; font-size: 14px; font-weight: 900; letter-spacing: -.5px; }
    .m-map .more { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--accent); }
    .m-map img { display: block; width: 100%; height: auto; }

    /* 많이 찾는 정보 2열 */
    .hot { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .hot-card { height: 82px; border-radius: 10px; box-shadow: 0 4px 12px rgba(30,80,170,.07); }
    .hot-card:nth-child(n+3) { display: none; }
    .hot-card > img { width: 70px; height: 82px; min-height: 0; }
    .hot-card .txt { padding: 7px 8px; gap: 3px; }
    .hot-card .tag { padding: 2px 7px; font-size: 9.5px; }
    .hot-card h3 { font-size: 11.5px; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hot-card p { font-size: 9px; line-height: 1.4; }
    .hot-card .chev { display: none; }

    /* 배너 */
    .m-banner { margin-top: 14px; border-radius: 14px; overflow: hidden; }
    .m-banner img { display: block; width: 100%; height: auto; }

    footer { margin-top: 16px; padding: 18px 0; font-size: 12px; }
    footer .container::before, footer .container::after { width: 30px; }

    /* 하단 탭바 */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 110; height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom); background: var(--panel); border-top: 1px solid var(--line);
      display: grid !important; grid-template-columns: repeat(4, 1fr);
    }
    .tabbar a, .tabbar button {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--muted); font-size: 10.5px; background: none; border: none; cursor: pointer; padding: 0;
    }
    .tabbar .on { color: var(--accent); font-weight: 700; }
    .tabbar .on::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 46px; margin-left: -23px; height: 3px; border-radius: 2px; background: var(--accent); }

    /* 메뉴 상세 페이지 */
    .page-head { padding: 24px 0 20px; }
    .page-head h1 { font-size: 25px; }
    .tip .body { padding-left: 18px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <a class="logo" href="#home" aria-label="홈으로">

  // ================= 페이지 =================

  // ================= 라우터 =================
  let lastMenu = null;
  function route() {
    const [id, sub] = (location.hash.slice(1) || 'home').split('/');
    const m = MENUS.find(x => x.id === id);
    $('menu').classList.remove('open');
    document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
    document.querySelectorAll('.tabbar [data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === (m ? m.id : 'home')));

    if (!m) {
      $('app').innerHTML = renderHome(); lastMenu = null; scrollTo(0, 0); bindHome(); return;
    }
    if (lastMenu !== m.id) { $('app').innerHTML = renderMenu(m); lastMenu = m.id; bindMenu(); if (!sub) scrollTo(0, 0); }
    document.title = `${m.title} · ${SITE.name}`;

    if (sub?.startsWith('g')) {
      document.getElementById(sub)?.scrollIntoView({ behavior: 'smooth' });
    } else if (sub) {
      const el = document.getElementById('t' + sub);
      if (el) { el.open = true; el.classList.add('open', 'hl'); setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 30); setTimeout(() => el.classList.remove('hl'), 1700); }
    }
  }

      const hits = ALL.filter(x => (x.t + ' ' + strip(x.d) + ' ' + x.g.title + ' ' + x.m.title).toLowerCase().includes(v)).slice(0, 12);
      res.innerHTML = hits.length
        ? hits.map(x => `<a href="#${x.m.id}/${x.gi}-${x.ti}">${x.m.icon} ${esc(x.t)}<small>${x.m.title} › ${x.g.title}</small></a>`).join('')
        : '<div class="none">검색 결과가 없어요 😢</div>';
      res.classList.add('show');
    };
    q.onkeydown = e => { if (e.key === 'Enter') res.querySelector('a')?.click(); if (e.key === 'Escape') res.classList.remove('show'); };
    $('qBtn').onclick = () => { q.oninput(); res.querySelector('a')?.click(); q.focus(); };
    document.addEventListener('click', e => { if (!e.target.closest('.search')) res.classList.remove('show'); }, { once: false });
    $('another').onclick = () => { $('today').innerHTML = hotHtml(); };
  }

  function bindMenu() {
    document.querySelectorAll('.tip').forEach(d => d.addEventListener('toggle', () => d.classList.toggle('open', d.open)));
    // 목차 클릭 시 해시를 바꾸지 않고 부드럽게 스크롤
    document.querySelectorAll('.toc a').forEach(a => a.onclick = e => {
      e.preventDefault(); document.getElementById('g' + a.dataset.g).scrollIntoView({ behavior: 'smooth' });
    });
  }

  addEventListener('hashchange', route);
  route();
})();
</script>
<script>
// 앱 설치용 서비스 워커 등록 (인터넷 주소로 열었을 때만)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
