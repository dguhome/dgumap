<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사이트 이름</title>
<!-- 앱(홈 화면에 추가) 설정 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b4fc6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자취지도">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  /* ===== 색 (여기 값만 바꾸면 사이트 전체 색이 바뀌어요) ===== */
  :root {
    --bg: #f6f9fe; --bg2: #eef4fe; --panel: #ffffff; --text: #12213f; --muted: #33405a; --line: #dbe5f5;
    --accent: #0b4fc6; --accent-2: #9dbcf3; --accent-weak: #e3eefe; --navy: #0f1d40;
    --shadow: 0 8px 24px rgba(30,80,170,.08);
    --hero1: #f6f9fe; --hero2: #eef4fe; --ic-blend: multiply;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1322; --bg2: #0f1729; --panel: #151f36; --text: #e8eefb; --muted: #aab7d0; --line: #263352;
      --accent: #6b9bff; --accent-2: #3b5ea8; --accent-weak: #1a2a52; --navy: #e8eefb;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --hero1: #101a30; --hero2: #0c1322; --ic-blend: normal;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1322; --bg2: #0f1729; --panel: #151f36; --text: #e8eefb; --muted: #aab7d0; --line: #263352;
    --accent: #6b9bff; --accent-2: #3b5ea8; --accent-weak: #1a2a52; --navy: #e8eefb;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    --hero1: #101a30; --hero2: #0c1322; --ic-blend: normal;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed; color: var(--text); line-height: 1.6;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  .container { max-width: 1360px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 100; background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
  }
  .topbar .container { display: flex; align-items: center; height: 80px; gap: 24px; }
  .logo { display: flex; align-items: center; gap: 8px; color: var(--accent); white-space: nowrap; cursor: pointer; }
  .logo b { font-size: 27px; font-weight: 900; letter-spacing: -1px; color: var(--navy); }
  .logo b span { color: var(--accent); }
  .divider { width: 1px; height: 26px; background: var(--line); }
  .menu { display: flex; gap: 2px; }
  .menu a {
    padding: 9px 14px; border-radius: 999px; font-size: 15.5px; font-weight: 500; white-space: nowrap; color: var(--text);
  }
  .menu a:hover { background: var(--accent-weak); }
  .menu a.active { color: var(--accent); background: var(--accent-weak); font-weight: 700; }
  .tools { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; cursor: pointer; font-size: 16px; color: var(--text);
  }
  .start-btn {
    display: flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; white-space: nowrap;
  }
  .start-btn:hover { filter: brightness(1.08); }
  #burger { display: none; }

  /* ---------- Hero ---------- */
  .hero { overflow: hidden; }
  .hero .container { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: center; min-height: 420px; }
  .hero-text { display: flex; flex-direction: column; gap: 16px; padding: 24px 0 36px; position: relative; z-index: 2; }
  .tagline {
    font-family: "Nanum Pen Script", cursive; font-size: 28px; color: var(--accent); transform: rotate(-3deg); transform-origin: left;
    text-decoration: underline; text-decoration-color: var(--accent-2); text-underline-offset: 6px; align-self: flex-start;
  }
  .hero h1 { font-size: 58px; line-height: 1.18; margin: 0; font-weight: 900; letter-spacing: -2.5px; color: var(--navy); }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); font-size: 18.5px; font-weight: 500; }
  .hero-art {
    display: block; margin-right: -24px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16%); mask-image: linear-gradient(90deg, transparent 0, #000 16%);
  }
  .hero-art img {
    /* 원본 그림 왼쪽 아래의 '검색' 버튼 조각과 위쪽 가장자리를 잘라내요 */
    display: block; width: 120%; max-width: none; height: auto; margin: -3.5% 0 0 -20%;
  }
  .search { position: relative; max-width: 680px; margin-top: 12px; }
  .search-box {
    display: flex; align-items: center; gap: 12px; padding: 7px 7px 7px 24px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(30,80,170,.10);
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { flex-shrink: 0; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 17px; color: var(--text); }
  .search button {
    border: none; border-radius: 999px; padding: 14px 40px; background: var(--accent); color: #fff;
    font-size: 18px; font-weight: 700; letter-spacing: 4px; cursor: pointer;
  }
  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); max-height: 360px; overflow-y: auto; display: none; z-index: 50;
  }
  .search-results.show { display: block; }
  .search-results a { display: block; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .search-results a:last-child { border-bottom: none; }
  .search-results a:hover { background: var(--bg); }
  .search-results small { color: var(--muted); display: block; font-size: 12px; }
  .search-results .none { padding: 14px 16px; color: var(--muted); font-size: 14px; }

  /* ---------- Sections ---------- */
  section.block { padding: 22px 0 18px; }
  .sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .sec-head::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--accent); }
  .sec-title { font-size: 26px; margin: 0; font-weight: 900; letter-spacing: -1px; }
  .sec-sub {
    margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px;
    background: none; border: none; padding: 6px 0; cursor: pointer;
  }
  .arrow {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-grid; place-items: center; flex-shrink: 0;
  }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .menu-card {
    position: relative; min-height: 146px; padding: 22px 56px 22px 22px; border-radius: 18px;
    background: linear-gradient(135deg, var(--t1, #e3eefe), var(--t2, #f2f7ff));
    border: 1px solid rgba(255,255,255,.8); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 18px; transition: transform .15s, box-shadow .15s;
  }
  .menu-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(30,80,170,.14); }
  .menu-card .ic { width: 96px; flex-shrink: 0; display: grid; place-items: center; font-size: 48px; }
  .menu-card .ic img { width: 100%; height: auto; mix-blend-mode: var(--ic-blend); border-radius: 14px; }
  .menu-card h3 { margin: 0 0 6px; font-size: 22px; font-weight: 900; letter-spacing: -.8px; color: #12213f; }
  .menu-card p { margin: 0; color: #33405a; font-size: 14.5px; }
  .menu-card .cnt { margin-top: 6px; font-size: 13px; color: #0b4fc6; font-weight: 700; }
  .chev {
    position: absolute; right: 16px; bottom: 16px; width: 34px; height: 34px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: grid; place-items: center; color: #0f1d40;
  }

  .hot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .hot-card {
    position: relative; display: flex; border-radius: 14px; overflow: hidden; background: var(--panel);
    border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .15s;
  }
  .hot-card:hover { transform: translateY(-3px); }
  .hot-card > img { width: 170px; height: 150px; object-fit: cover; flex-shrink: 0; }
  .hot-card .txt { padding: 18px 54px 18px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .hot-card .tag { align-self: flex-start; padding: 3px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .hot-card h3 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.8px; }
  .hot-card p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hot-card .chev { border: 1px solid var(--line); bottom: 18px; }

  /* ---------- Page ---------- */
  .page-head { background: linear-gradient(135deg, var(--hero1), var(--hero2)); border-bottom: 1px solid var(--line); padding: 40px 0 32px; }
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .crumb a:hover { color: var(--accent); }
  .page-head h1 { margin: 0; font-size: 32px; letter-spacing: -.8px; }
  .page-head p { margin: 6px 0 0; color: var(--muted); }
  .page-body { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; padding-top: 32px; padding-bottom: 60px; }
  .toc { position: sticky; top: 84px; align-self: start; }
  .toc b { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .toc a { display: block; padding: 7px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); border-left: 2px solid transparent; }
  .toc a:hover { color: var(--text); background: var(--panel); }
  .group { margin-bottom: 32px; scroll-margin-top: 84px; }
  .group h2 { font-size: 19px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .tip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden;
    transition: border-color .15s;
  }
  .tip.open { border-color: var(--accent-2); }
  .tip summary {
    list-style: none; padding: 16px 18px; cursor: pointer; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 10px;
  }
  .tip summary::-webkit-details-marker { display: none; }
  .tip summary::after { content: "＋"; margin-left: auto; color: var(--muted); font-weight: 400; transition: transform .2s; }
  .tip[open] summary::after { transform: rotate(45deg); color: var(--accent); }
  .tip .num {
    width: 26px; height: 26px; border-radius: 8px; background: var(--accent-weak); color: var(--accent);
    display: grid; place-items: center; font-size: 13px; flex-shrink: 0;
  }
  .tip .body { padding: 0 18px 18px 54px; color: var(--text); font-size: 14.5px; }
  .tip .body p { margin: 0 0 8px; }
  .tip .body ul { margin: 0; padding-left: 18px; }
  .tip .body li { margin: 3px 0; }
  .tip .body .note { background: var(--accent-weak); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }
  .tip.hl { animation: hl 1.6s; }
  @keyframes hl { 0%,40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }

  /* ---------- 자취팁 ---------- */
  .tips-page { max-width: 820px; margin: 0 auto; padding: 24px 0 60px; }
  .tips-hero { background: #17294d; color: #fff; border-radius: 22px; padding: 26px 24px 24px; }
  .tips-hero .top { display: flex; align-items: center; justify-content: space-between; }
  .tips-hero .brand { font-weight: 800; font-size: 17px; color: #c9d6ee; }
  .tips-hero .badge { font-size: 12.5px; font-weight: 800; color: #4ade80; background: rgba(74,222,128,.12); border-radius: 999px; padding: 4px 12px; letter-spacing: .5px; }
  .tips-hero h1 { margin: 14px 0 6px; font-size: 30px; letter-spacing: -.8px; color: #fff; }
  .tips-hero p { margin: 0 0 16px; color: #d5def0; }
  .tips-hero label { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 13px 16px; }
  .tips-hero label svg { color: #5b6b8c; flex: none; }
  .tips-hero input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 16px; background: none; color: #12213f; }
  .tips-sec { padding: 24px 0 4px; border-bottom: 1px solid var(--line); }
  .tips-sec:last-of-type { border-bottom: 0; }
  .tips-sec h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.4px; display: flex; align-items: center; gap: 8px; }
  .tips-sec h2 button { margin-left: auto; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; cursor: pointer; }
  .tip-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 20px; }
  .tip-cat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .tip-cat svg { color: var(--accent); }
  .tip-cat.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tip-cat.on svg { color: #fff; }
  .tip-pick { display: block; color: var(--text); padding-bottom: 20px; }
  .tip-pick .ph { aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: var(--bg2); }
  .tip-pick img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
  .tip-pick:hover img { transform: scale(1.03); }
  .tip-pick h3 { margin: 14px 0 6px; font-size: 20px; letter-spacing: -.4px; }
  .tip-meta { font-size: 13.5px; color: var(--muted); }
  .tip-list { display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; }
  .tip-row { display: flex; align-items: center; gap: 16px; color: var(--text); }
  .tip-row .th { width: 92px; height: 92px; flex: none; border-radius: 16px; overflow: hidden; background: var(--accent-weak); display: grid; place-items: center; color: var(--accent); }
  .tip-row .th img { width: 100%; height: 100%; object-fit: cover; }
  .tip-row h3 { margin: 0 0 6px; font-size: 17px; letter-spacing: -.3px; }
  .tip-row:hover h3 { color: var(--accent); }
  .tip-list .none { color: var(--muted); padding: 10px 0; }
  .tip-article { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
  .tip-article .back { display: inline-block; font-size: 14px; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
  .tip-article .ph { aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
  .tip-article .ph img { width: 100%; height: 100%; object-fit: cover; }
  .tip-article h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.6px; }
  .tip-article .body { margin-top: 16px; font-size: 15.5px; line-height: 1.75; }
  .tip-article .body li { margin: 6px 0; }
  .tip-article .body .note { background: var(--accent-weak); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }
  @media (max-width: 600px) {
    .tips-page { padding-top: 14px; }
    .tips-hero { padding: 22px 18px 18px; }
    .tips-hero h1 { font-size: 26px; }
    .tip-row .th { width: 80px; height: 80px; }
    .tip-row h3 { font-size: 15.5px; }
    .tip-article { padding: 18px; }
  }

  /* ---------- 자취용어백과 ---------- */
  .terms-box { max-width: 780px; }
  .term-search { display: block; width: 100%; font: inherit; font-size: 16px; padding: 14px 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none; }
  .term-search:focus { border-color: var(--accent); }
  .term-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .term-chips .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 14.5px; padding: 7px 16px; }
  .term-chips .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .term-count { font-size: 13px; color: var(--muted); margin: 12px 2px 0; }
  /* 용어 목록은 상자 안에서 따로 스크롤돼요 (높이는 max-height로 조절) */
  .terms {
    position: relative; max-height: 60vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; margin-top: 8px;
    scrollbar-width: thin; scrollbar-color: var(--accent-2) transparent;
  }
  .terms::-webkit-scrollbar { width: 8px; }
  .terms::-webkit-scrollbar-track { background: transparent; }
  .terms::-webkit-scrollbar-thumb { background: var(--accent-2); border-radius: 99px; }
  .term { padding: 20px 4px; border-bottom: 1px solid var(--line); scroll-margin-top: 12px; }
  .term:last-child { border-bottom: 0; }
  .term .hd { display: flex; align-items: center; gap: 10px; }
  .term h3 { margin: 0; font-size: 18px; letter-spacing: -.3px; }
  .term .cat { margin-left: auto; flex: none; font-size: 12.5px; font-weight: 600; background: var(--bg2); color: var(--muted); border-radius: 999px; padding: 4px 11px; }
  .term .d { margin: 8px 0 0; font-size: 15px; }
  .term .more { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); }
  .term.hl { animation: hl 1.6s; border-radius: 12px; }
  .terms .none { color: var(--muted); padding: 24px 4px; }
  @media (max-width: 600px) { .terms { padding: 0 12px; } .term h3 { font-size: 16.5px; } .term .d { font-size: 14.5px; } }

  /* ---------- 월세 매물 카드 ---------- */
  .room-search { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
  .room-search svg { flex: none; color: var(--muted); }
  .room-search input { flex: 1; min-width: 0; font: inherit; font-size: 15px; border: 0; outline: 0; background: transparent; color: var(--text); }
  .room-search .total { flex: none; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--bg2); border-radius: 999px; padding: 4px 10px; }
  .room-filter { background: var(--accent-weak); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .room-filter b { display: block; font-size: 15px; margin-bottom: 10px; }
  .room-filter .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .room-filter .row + .row { margin-top: 10px; }
  .chip { font: inherit; font-size: 13.5px; font-weight: 600; border: 0; border-radius: 999px; padding: 6px 13px; cursor: pointer; background: var(--panel); color: var(--text); }
  .chip.on { background: var(--accent); color: #fff; }
  .row.sort .chip { font-size: 12.5px; font-weight: 500; padding: 4px 11px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .row.sort .chip.on { background: var(--panel); color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .rooms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .room {
    display: flex; flex-direction: column; gap: 5px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 8px 8px 14px; transition: border-color .15s, transform .15s; color: var(--text);
  }
  a.room:hover { border-color: var(--accent-2); transform: translateY(-2px); }
  .room .ph { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--bg2); display: grid; place-items: center; font-size: 40px; margin-bottom: 6px; }
  .room .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .room .ph .sample { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; padding: 2px 7px; }
  .room h3, .room .price, .room .meta, .room .foot { margin: 0 6px; }
  .room h3 { font-size: 16px; }
  .room .price { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: -.3px; }
  .room .meta { font-size: 13.5px; color: var(--muted); }
  .room .meta span { white-space: nowrap; }
  .room .foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }

      scrollTo(0, 0); return;
    }
    $('tipsView').innerHTML = tipsMain(m);
    $('tipQ').value = tipState.q;
    $('tipQ').oninput = e => { tipState.q = e.target.value; drawTipFilter(m); };
    $('tipCats').onclick = e => { const b = e.target.closest('.tip-cat'); if (!b) return; tipState.cat = tipState.cat === b.dataset.cat ? '' : b.dataset.cat; drawTipFilter(m); };
    $('tipReset').onclick = () => { tipState.q = ''; tipState.cat = ''; $('tipQ').value = ''; drawTipFilter(m); };
    drawTipFilter(m);
  }

  // ---------- 자취용어백과 ----------
  const termState = { q: '', c: '전체' };
  function termsHtml(m) {
    return `
      <div class="terms-box">
        <input class="term-search" id="termQ" type="search" placeholder="궁금한 용어 검색하기" aria-label="용어 검색">
        <div class="term-chips" id="termChips">${['전체', ...m.termCats].map(c => `<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        <p class="term-count" id="termCount"></p>
        <div class="terms" id="terms"></div>
      </div>`;
  }
  function drawTerms(m) {
    const q = termState.q.trim().toLowerCase(), c = termState.c;
    const list = m.terms.map((x, i) => ({ ...x, i })).filter(x => (c === '전체' || x.c === c) &&
      (!q || [x.w, x.d, x.more, x.c].join(' ').toLowerCase().includes(q)));
    document.querySelectorAll('#termChips .chip').forEach(b => b.classList.toggle('on', b.dataset.c === c));
    $('termCount').textContent = `용어 ${list.length}개`;
    $('terms').innerHTML = list.length ? list.map(x => `
        <div class="term" id="w${x.i}">
          <div class="hd"><h3>${esc(x.w)}</h3><span class="cat">${esc(x.c)}</span></div>
          <p class="d">${esc(x.d)}</p>
          ${x.more ? `<p class="more">${esc(x.more)}</p>` : ''}
        </div>`).join('') : '<div class="none">찾는 용어가 없어요 😢 다른 말로 검색해 보세요.</div>';
    $('terms').scrollTop = 0; fitTerms();
  }
  // 용어가 5개 정도 보이도록 상자 높이를 맞춰요 (6번째 용어가 살짝 보이면 스크롤할 수 있다는 걸 알 수 있어요)
  const TERMS_SHOWN = 5;
  function fitTerms() {
    const box = $('terms'); if (!box) return;
    const items = box.querySelectorAll('.term');
    box.style.maxHeight = items.length > TERMS_SHOWN ? (items[TERMS_SHOWN].offsetTop + 28) + 'px' : 'none';
  }
  addEventListener('resize', fitTerms);

  // ---------- 월세 매물 ----------
  // 월세/전세 구분: deal을 적거나, 월세(rent)가 0이면 전세로 봐요
  const dealOf = r => r.deal || (r.rent === 0 ? '전세' : '월세');
  const won = v => v == null || v === '' ? '?' : (v >= 10000 ? (v / 10000).toLocaleString() + '억' : v.toLocaleString());
  // 한 달 기준 금액: 사글세는 한 번에 내는 돈을 달 수(모르면 10달)로 나눠서 비교해요
  const perMonth = r => dealOf(r) === '사글세' ? (r.lump ? r.lump / (r.months || 10) : null) : r.rent;
  const ROOM_SORTS = [['', '등록순'], ['rent', '월세 낮은순'], ['deposit', '보증금 낮은순'], ['walk', '가까운순'], ['fee', '관리비 낮은순']];
  const roomState = { q: '', type: '', town: '', sort: '' };
  function roomCard(r) {
    const tag = r.url ? 'a' : 'div';
    const attr = r.url ? ` href="${esc(r.url)}" target="_blank" rel="noopener"` : '';
    const meta = [dealOf(r) === '사글세' && r.lump && r.months ? `한 달 약 ${won(Math.round(r.lump / r.months))}만` : '', r.walk != null && r.walk !== '' ? `학교까지 도보 ${esc(r.walk)}분` : '', r.fee != null ? `관리비 ${won(r.fee)}만` : '']
      .filter(Boolean).map(t => `<span>${t}</span>`).join(' · ') || esc(r.addr || '');
    return `<${tag} class="room"${attr}>
        <div class="ph">${r.img ? `<img src="${esc(r.img)}" alt="" loading="lazy">` : '🏠'}${r.sample ? '<span class="sample">예시</span>' : ''}</div>
        <h3>${esc(r.title || '매물')}</h3>
        <div class="price">${dealOf(r) === '전세' ? `전세 ${won(r.deposit)}` : dealOf(r) === '사글세' ? `보증금 ${won(r.deposit)} / 사글세 ${won(r.lump)}${r.months ? ` (${esc(r.months)}달)` : ''}` : `보증금 ${won(r.deposit)} / 월 ${won(r.rent)}`}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        <div class="foot">${r.town ? `<span class="tag">📍 ${esc(r.town)}</span>` : ''}${r.type ? `<span class="tag">${esc(r.type)}</span>` : ''}${r.url ? '<span class="go">보러가기 ↗</span>' : ''}</div>
      </${tag}>`;
  }
  function roomsHtml(m) {
    const types = [...new Set(m.rooms.map(r => r.type).filter(Boolean))];
    const towns = [...new Set(m.rooms.map(r => r.town).filter(Boolean))];
    return `
      <label class="room-search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="roomQ" type="search" placeholder="자취방 검색 (이름·위치·메모)" aria-label="매물 검색">
        <span class="total" id="roomTotal"></span>
      </label>
      <div class="room-filter">
        <b>검색 및 필터</b>
        <div class="row" id="roomTypes">${['', ...types, '월세', '전세', ...(m.rooms.some(r => dealOf(r) === '사글세') ? ['사글세'] : [])].map(t => `<button type="button" class="chip${t === roomState.type ? ' on' : ''}" data-type="${esc(t)}">${t ? esc(t) : '전체'}</button>`).join('')}</div>
        ${towns.length > 1 ? `<div class="row" id="roomTowns">${['', ...towns].map(t => `<button type="button" class="chip${t === roomState.town ? ' on' : ''}" data-town="${esc(t)}">${t ? '📍 ' + esc(t) : '전체 동네'}</button>`).join('')}</div>` : ''}
        <div class="row sort" id="roomSorts">${ROOM_SORTS.map(([k, l]) => `<button type="button" class="chip${k === roomState.sort ? ' on' : ''}" data-sort="${k}">${l}</button>`).join('')}</div>
      </div>
      <div class="rooms" id="rooms"></div>
      <p style="font-size:12.5px;color:var(--muted);margin:14px 0 0">가격은 만원 기준이에요. 실제 조건은 매물 링크에서 꼭 다시 확인하세요.</p>`;
  }
  function drawRooms(m) {
    const q = roomState.q.trim().toLowerCase(), { type, town, sort } = roomState;
    let list = m.rooms.filter(r => (!type || r.type === type || dealOf(r) === type) && (!town || r.town === town) &&
      (!q || [r.title, r.addr, r.memo, r.type, r.town, dealOf(r)].join(' ').toLowerCase().includes(q)));
    const val = (r, k) => (k === 'rent' ? perMonth(r) : r[k]) ?? Infinity;
    if (sort) list = [...list].sort((a, b) => val(a, sort) - val(b, sort));
    $('roomTotal').textContent = `${list.length}개 매물`;
    $('rooms').innerHTML = list.length ? list.map(roomCard).join('') : '<div class="none">조건에 맞는 매물이 없어요 😢</div>';
  }

  function renderMenu(m) {
    if (m.articles) return tipsPage(m);
    const i = MENUS.indexOf(m), prev = MENUS[i - 1], next = MENUS[i + 1];
    return `
      <section class="page-head">
        <div class="container">
          <div class="crumb"><a href="#home">홈</a> › ${m.title}</div>
          <h1>${m.icon} ${m.title}</h1>
          <p>${m.desc}</p>
        </div>
      </section>
      <div class="container page-body"${m.rooms || m.terms ? ' style="grid-template-columns:minmax(0,1fr)"' : ''}>
        <aside class="toc"${m.rooms || m.terms ? ' style="display:none"' : ''}>
          <b>목차</b>
          ${m.groups.map((g, gi) => `<a href="#${m.id}/g${gi}" data-g="${gi}">${g.icon} ${g.title}</a>`).join('')}
        </aside>
        <div>
          ${m.terms ? termsHtml(m) : ''}
          ${m.rooms ? roomsHtml(m) : ''}
          ${m.soon ? '<div class="group"><p style="color:var(--muted)">🛠️ 준비 중이에요. 곧 열릴 예정이에요!</p></div>' : ''}
          ${m.groups.map((g, gi) => `
            <div class="group" id="g${gi}">
              <h2>${g.icon} ${g.title}</h2>
              ${g.tips.map((t, ti) => `
                <details class="tip" id="t${gi}-${ti}">
                  <summary><span class="num">${ti + 1}</span>${esc(t.t)}</summary>
                  <div class="body">${t.d}</div>
                </details>`).join('')}
            </div>`).join('')}
          <div class="pager">
            ${prev ? `<a href="${hrefOf(prev)}"><small>← 이전</small>${prev.icon} ${prev.title}</a>` : '<span style="flex:1"></span>'}
            ${next ? `<a class="next" href="${hrefOf(next)}"><small>다음 →</small>${next.icon} ${next.title}</a>` : `<a class="next" href="#home"><small>처음으로 →</small>🏠 홈</a>`}
          </div>
        </div>
      </div>`;
  }

  // ================= 라우터 =================
  let lastMenu = null;
  function route() {
    const [id, sub] = (location.hash.slice(1) || 'home').split('/');
    const m = MENUS.find(x => x.id === id);
    $('menu').classList.remove('open');
    document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
    document.querySelectorAll('.tabbar [data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === (m ? m.id : 'home')));

    if (!m) {
      $('app').innerHTML = renderHome(); lastMenu = null; scrollTo(0, 0); bindHome(); return;
    }
    if (lastMenu !== m.id) { $('app').innerHTML = renderMenu(m); lastMenu = m.id; bindMenu(); if (!sub) scrollTo(0, 0); }
    document.title = `${m.title} · ${SITE.name}`;
    if (m.articles) { drawTips(m, sub); return; }

    if (sub?.startsWith('w') && m.terms) {
      // 검색에서 용어를 누르면: 필터를 풀고 그 용어로 이동
      termState.q = ''; termState.c = '전체'; $('termQ').value = ''; drawTerms(m);
      const el = document.getElementById(sub);
      if (el) { el.classList.add('hl'); setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 30); setTimeout(() => el.classList.remove('hl'), 1700); }
    } else if (sub?.startsWith('g')) {
      document.getElementById(sub)?.scrollIntoView({ behavior: 'smooth' });
    } else if (sub) {
      const el = document.getElementById('t' + sub);
      if (el) { el.open = true; el.classList.add('open', 'hl'); setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 30); setTimeout(() => el.classList.remove('hl'), 1700); }
    }
  }

  function bindHome() {
    document.title = SITE.name;
    const q = $('q'), res = $('results');
    q.oninput = () => {
      const v = q.value.trim().toLowerCase();
      if (!v) { res.classList.remove('show'); return; }
      const hits = ALL.filter(x => (x.t + ' ' + strip(x.d) + ' ' + x.g.title + ' ' + x.m.title).toLowerCase().includes(v)).slice(0, 12);
      res.innerHTML = hits.length
        ? hits.map(x => `<a href="${x.href}">${x.m.icon} ${esc(x.t)}<small>${x.m.title} › ${x.g.title}</small></a>`).join('')
        : '<div class="none">검색 결과가 없어요 😢</div>';
      res.classList.add('show');
    };
    q.onkeydown = e => { if (e.key === 'Enter') res.querySelector('a')?.click(); if (e.key === 'Escape') res.classList.remove('show'); };
    $('qBtn').onclick = () => { q.oninput(); res.querySelector('a')?.click(); q.focus(); };
    document.addEventListener('click', e => { if (!e.target.closest('.search')) res.classList.remove('show'); }, { once: false });
    $('another').onclick = () => { $('today').innerHTML = hotHtml(); };
  }

  function bindMenu() {
    const m = MENUS.find(x => x.id === lastMenu);
    if (m?.terms) {
      $('termQ').value = termState.q;
      $('termQ').oninput = e => { termState.q = e.target.value; drawTerms(m); };
      $('termChips').onclick = e => { const b = e.target.closest('.chip'); if (b) { termState.c = b.dataset.c; drawTerms(m); } };
      drawTerms(m);
    }
    if (m?.rooms) {
      $('roomQ').value = roomState.q;
      $('roomQ').oninput = e => { roomState.q = e.target.value; drawRooms(m); };
      const pick = (box, key) => $(box) && ($(box).onclick = e => {
        const b = e.target.closest('.chip'); if (!b) return;
        roomState[key] = b.dataset[key];
        $(box).querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
        drawRooms(m);
      });
      pick('roomTypes', 'type'); pick('roomTowns', 'town'); pick('roomSorts', 'sort');
      drawRooms(m);
    }
    document.querySelectorAll('.tip').forEach(d => d.addEventListener('toggle', () => d.classList.toggle('open', d.open)));
    // 목차 클릭 시 해시를 바꾸지 않고 부드럽게 스크롤
    document.querySelectorAll('.toc a').forEach(a => a.onclick = e => {
      e.preventDefault(); document.getElementById('g' + a.dataset.g).scrollIntoView({ behavior: 'smooth' });
    });
  }

  addEventListener('hashchange', route);
  route();
})();
</script>
<script>
// 앱 설치용 서비스 워커 등록 (인터넷 주소로 열었을 때만)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
